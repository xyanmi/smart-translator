<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>API测试</title>
    <link rel="stylesheet" href="settings.css">
    <style>
        .test-container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        
        .test-left, .test-right {
            flex: 1;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .test-content {
            margin-bottom: 20px;
        }
        
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        
        textarea {
            width: 100%;
            min-height: 100px;
            margin-bottom: 10px;
        }
        
        .back-btn {
            padding: 5px 10px;
            background-color: #666;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .test-btn {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="test-header">
            <h1>API测试</h1>
            <button class="back-btn" onclick="window.location.href='settings.html'">返回设置</button>
        </div>

        <div class="test-content" style="margin-bottom: 20px;">
            <label>
                <span>目标 API:</span>
                <select id="api-selector" style="margin-top: 8px;"></select>
            </label>
            <p id="api-summary" style="margin-top: 10px; color: #666;"></p>
        </div>
        
        <div class="test-container">
            <div class="test-left">
                <h3>请求信息</h3>
                <div class="test-content">
                    <label>
                        <span>测试文本:</span>
                        <textarea id="test-text" placeholder="输入要翻译的文本">这是一段测试文本，用于测试翻译API的功能。</textarea>
                    </label>
                    <h4>请求详情</h4>
                    <pre id="request-info"></pre>
                    <button id="send-test" class="test-btn">发送测试请求</button>
                </div>
            </div>
            
            <div class="test-right">
                <h3>响应结果</h3>
                <pre id="response-info">等待发送请求...</pre>
            </div>
        </div>
    </div>
    
    <script src="../shared/translation-api.js"></script>
    <script src="api-test-app.js"></script>
</body>
</html>
